name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    name: 建置 Windows 安裝包
    runs-on: windows-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 還原相依套件
        run: dotnet restore

      - name: 執行測試
        run: dotnet test --configuration Release --verbosity normal

      - name: 發布應用程式
        run: >
          dotnet publish src/Specurai.Desktop -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.get-version.outputs.version }}
          -o publish

      - name: 建立 Velopack 安裝包
        run: |
          dotnet tool install -g vpk
          vpk pack -u Specurai -v ${{ steps.get-version.outputs.version }} -p publish -e Specurai.Desktop.exe --packTitle "Specurai" -i src/Specurai.Desktop/Assets/Specurai.ico -o Releases

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Releases/*
          retention-days: 30

  build-macos:
    name: 建置 macOS 安裝包
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
        include:
          - runtime: osx-arm64
            arch: arm64
          - runtime: osx-x64
            arch: x64
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 還原相依套件
        run: dotnet restore

      - name: 執行測試
        run: dotnet test --configuration Release --verbosity normal

      - name: 發布應用程式
        run: >
          dotnet publish src/Specurai.Desktop -c Release -r ${{ matrix.runtime }} --self-contained
          -p:Version=${{ steps.get-version.outputs.version }}
          -o publish

      - name: 建立 macOS .app bundle 和 .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p Releases
          chmod +x scripts/create-macos-bundle.sh
          ./scripts/create-macos-bundle.sh "${{ steps.get-version.outputs.version }}" "${{ matrix.runtime }}" publish Releases

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: Releases/*
          retention-days: 30

  build-linux:
    name: 建置 Linux 安裝包
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 還原相依套件
        run: dotnet restore

      - name: 執行測試
        run: dotnet test --configuration Release --verbosity normal

      - name: 發布應用程式
        run: >
          dotnet publish src/Specurai.Desktop -c Release -r linux-x64 --self-contained
          -p:Version=${{ steps.get-version.outputs.version }}
          -o publish

      - name: 建立 Velopack 安裝包
        run: |
          dotnet tool install -g vpk
          vpk pack -u Specurai -v ${{ steps.get-version.outputs.version }} -p publish -e Specurai.Desktop --packTitle "Specurai" -i src/Specurai.Desktop/Assets/Specurai.png -o Releases

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: Releases/*
          retention-days: 30

  build-mcp-server:
    name: 建置 MCP Server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            artifact: Specurai.McpServer-win-x64.zip
          - runtime: osx-arm64
            artifact: Specurai.McpServer-osx-arm64.tar.gz
          - runtime: osx-x64
            artifact: Specurai.McpServer-osx-x64.tar.gz
          - runtime: linux-x64
            artifact: Specurai.McpServer-linux-x64.tar.gz
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 發布 MCP Server
        run: >
          dotnet publish src/Specurai.McpServer -c Release
          -r ${{ matrix.runtime }} --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.get-version.outputs.version }}
          -o mcp-publish

      - name: 打包（Windows）
        if: contains(matrix.runtime, 'win')
        run: |
          mkdir -p Releases
          cd mcp-publish
          zip -r ../Releases/${{ matrix.artifact }} .
          cd ..
        shell: bash

      - name: 打包（macOS / Linux）
        if: "!contains(matrix.runtime, 'win')"
        run: |
          mkdir -p Releases
          cd mcp-publish
          chmod +x Specurai.McpServer
          tar czf ../Releases/${{ matrix.artifact }} .
          cd ..

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-${{ matrix.runtime }}
          path: Releases/*
          retention-days: 30

  build-cli:
    name: 建置 CLI 單一執行檔
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: win-x64,   artifact: Specurai.Cli-win-x64.zip }
          - { runtime: osx-arm64, artifact: Specurai.Cli-osx-arm64.tar.gz }
          - { runtime: osx-x64,   artifact: Specurai.Cli-osx-x64.tar.gz }
          - { runtime: linux-x64, artifact: Specurai.Cli-linux-x64.tar.gz }
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: 發布 CLI
        run: >
          dotnet publish src/Specurai.Cli -c Release
          -r ${{ matrix.runtime }} --self-contained
          -p:PublishSingleFile=true
          -p:PackAsTool=false
          -p:Version=${{ steps.get-version.outputs.version }}
          -o cli-publish
      - name: 打包（Windows）
        if: contains(matrix.runtime, 'win')
        shell: bash
        run: |
          mkdir -p Releases
          (cd cli-publish && zip -r ../Releases/${{ matrix.artifact }} .)
      - name: 打包（macOS / Linux）
        if: "!contains(matrix.runtime, 'win')"
        run: |
          mkdir -p Releases
          (cd cli-publish && chmod +x Specurai.Cli && tar czf ../Releases/${{ matrix.artifact }} .)
      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.runtime }}
          path: Releases/*
          retention-days: 30

  publish-nuget:
    name: 發布 NuGet 套件
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 建立 NuGet 套件
        run: >
          dotnet pack src/Specurai.McpServer -c Release
          -p:Version=${{ steps.get-version.outputs.version }}
          -o nupkg

      - name: 建立 CLI NuGet 套件
        run: >
          dotnet pack src/Specurai.Cli -c Release
          -p:Version=${{ steps.get-version.outputs.version }}
          -o nupkg

      - name: NuGet 登入（Trusted Publishing OIDC）
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: KerryHuangTW

      - name: 發布至 NuGet
        run: >
          dotnet nuget push nupkg/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: 上傳 NuGet 套件
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          retention-days: 30

  create-release:
    name: 建立 GitHub Release
    needs: [build-windows, build-macos, build-linux, build-mcp-server, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下載所有安裝包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理發布檔案
        run: |
          mkdir -p release-files
          cp artifacts/windows-installer/* release-files/ 2>/dev/null || true
          cp artifacts/macos-installer-arm64/* release-files/ 2>/dev/null || true
          cp artifacts/macos-installer-x64/* release-files/ 2>/dev/null || true
          cp artifacts/linux-installer/* release-files/ 2>/dev/null || true
          cp artifacts/mcp-server-win-x64/* release-files/ 2>/dev/null || true
          cp artifacts/mcp-server-osx-arm64/* release-files/ 2>/dev/null || true
          cp artifacts/mcp-server-osx-x64/* release-files/ 2>/dev/null || true
          cp artifacts/mcp-server-linux-x64/* release-files/ 2>/dev/null || true
          cp artifacts/cli-win-x64/*   release-files/ 2>/dev/null || true
          cp artifacts/cli-osx-arm64/* release-files/ 2>/dev/null || true
          cp artifacts/cli-osx-x64/*   release-files/ 2>/dev/null || true
          cp artifacts/cli-linux-x64/* release-files/ 2>/dev/null || true
          ls -la release-files/
          # 確保 macOS MCP Server 獨立執行檔存在（Mac 使用者主要安裝路徑）
          for artifact in Specurai.McpServer-osx-arm64.tar.gz Specurai.McpServer-osx-x64.tar.gz; do
            if [ ! -f "release-files/$artifact" ]; then
              echo "::error::缺少必要的 MCP Server 發布檔：$artifact"
              exit 1
            fi
          done

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          append_body: true
          body: |
            ## MCP Server 安裝

            ### 方式一：下載獨立執行檔（免安裝 .NET SDK）

            下載對應平台的檔案並解壓：

            - **macOS (Apple Silicon)：** `Specurai.McpServer-osx-arm64.tar.gz`
            - **macOS (Intel)：** `Specurai.McpServer-osx-x64.tar.gz`
            - **Windows：** `Specurai.McpServer-win-x64.zip`
            - **Linux：** `Specurai.McpServer-linux-x64.tar.gz`

            macOS / Linux 解壓後需補執行權限（tar.gz 內已保留，首次開啟 macOS 可能需 `xattr -dr com.apple.quarantine Specurai.McpServer`）。

            設定 AI 客戶端指向執行檔的絕對路徑，例如：

            ```json
            {"mcpServers":{"specurai":{"command":"/absolute/path/to/Specurai.McpServer"}}}
            ```

            ### 方式二：dotnet tool（需已安裝 .NET 8 SDK）

            ```bash
            dotnet tool install -g Specurai.McpServer
            ```

            安裝後設定 AI 客戶端：

            ```bash
            # Claude Code
            claude mcp add specurai -s user -- specurai-mcp

            # 其他客戶端（Claude Desktop、Cursor、Windsurf）
            # 在設定檔加入：{"mcpServers":{"specurai":{"command":"specurai-mcp"}}}
            ```

            ## CLI（specurai）安裝

            ### 一鍵安裝（免 .NET SDK）

            - **Windows（PowerShell）：** `irm https://raw.githubusercontent.com/KerryHuang/DatabaseDescriptionApp/master/scripts/install.ps1 | iex`
            - **macOS / Linux：** `curl -fsSL https://raw.githubusercontent.com/KerryHuang/DatabaseDescriptionApp/master/scripts/install.sh | bash`

            安裝後（Windows 需重開終端機）執行 `specurai --help`。更新＝重跑安裝指令。

            ### dotnet tool（需 .NET 8 SDK）

            ```bash
            dotnet tool install -g Specurai.Cli
            ```

            ## macOS 桌面應用程式安裝說明

            macOS 版本目前未經 Apple 公證，首次開啟時可能會出現安全性警告。

            **安裝步驟：**
            1. 下載對應的 `.dmg` 檔案
            2. 點兩下開啟 `.dmg`，將 Specurai 拖曳到 Applications
            3. 首次開啟前，在終端機執行：
               ```
               xattr -cr /Applications/Specurai.app
               ```
            4. 之後即可正常從 Launchpad 或 Applications 開啟
