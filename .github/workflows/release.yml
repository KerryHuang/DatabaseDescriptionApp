name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    name: 建置 Windows 安裝包
    runs-on: windows-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 還原相依套件
        run: dotnet restore

      - name: 執行測試
        run: dotnet test --configuration Release --verbosity normal

      - name: 發布應用程式
        run: dotnet publish src/Specurai.Desktop -c Release -r win-x64 --self-contained -o publish

      - name: 建立 Velopack 安裝包
        run: |
          dotnet tool install -g vpk
          vpk pack -u Specurai -v ${{ steps.get-version.outputs.version }} -p publish -e Specurai.Desktop.exe --packTitle "Specurai" -i src/Specurai.Desktop/Assets/avalonia-logo.ico -o Releases

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Releases/*
          retention-days: 30

  build-macos:
    name: 建置 macOS 安裝包
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
        include:
          - runtime: osx-arm64
            arch: arm64
          - runtime: osx-x64
            arch: x64
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 還原相依套件
        run: dotnet restore

      - name: 執行測試
        run: dotnet test --configuration Release --verbosity normal

      - name: 發布應用程式
        run: dotnet publish src/Specurai.Desktop -c Release -r ${{ matrix.runtime }} --self-contained -o publish

      - name: 建立 macOS .app bundle 和 .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p Releases
          chmod +x scripts/create-macos-bundle.sh
          ./scripts/create-macos-bundle.sh "${{ steps.get-version.outputs.version }}" "${{ matrix.runtime }}" publish Releases

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: Releases/*
          retention-days: 30

  build-linux:
    name: 建置 Linux 安裝包
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 取得版本號
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 還原相依套件
        run: dotnet restore

      - name: 執行測試
        run: dotnet test --configuration Release --verbosity normal

      - name: 發布應用程式
        run: dotnet publish src/Specurai.Desktop -c Release -r linux-x64 --self-contained -o publish

      - name: 建立 Velopack 安裝包
        run: |
          dotnet tool install -g vpk
          vpk pack -u Specurai -v ${{ steps.get-version.outputs.version }} -p publish -e Specurai.Desktop --packTitle "Specurai" -i src/Specurai.Desktop/Assets/Specurai.png -o Releases

      - name: 上傳安裝包
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: Releases/*
          retention-days: 30

  create-release:
    name: 建立 GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下載所有安裝包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理發布檔案
        run: |
          mkdir -p release-files
          cp artifacts/windows-installer/* release-files/ 2>/dev/null || true
          cp artifacts/macos-installer-arm64/* release-files/ 2>/dev/null || true
          cp artifacts/macos-installer-x64/* release-files/ 2>/dev/null || true
          cp artifacts/linux-installer/* release-files/ 2>/dev/null || true
          ls -la release-files/

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          append_body: true
          body: |
            ## macOS 安裝說明

            macOS 版本目前未經 Apple 公證，首次開啟時可能會出現安全性警告。

            **安裝步驟：**
            1. 下載對應的 `.dmg` 檔案
            2. 點兩下開啟 `.dmg`，將 Specurai 拖曳到 Applications
            3. 首次開啟前，在終端機執行：
               ```
               xattr -cr /Applications/Specurai.app
               ```
            4. 之後即可正常從 Launchpad 或 Applications 開啟
